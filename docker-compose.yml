services:
  django:
    build: .
    ports:
      - "9000:9000"
    volumes:
      - ./data:/app/data
    environment:
      - DEBUG=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_EXTERNAL_ENDPOINT=http://localhost:9001
      - MINIO_MEDIA_BUCKET_NAME=media
    command: >
      sh -c "python manage.py makemigrations && python manage.py migrate && 
             python scripts/init_minio.py &&
             python manage.py runserver 0.0.0.0:9000"

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9001:9000"  # API
      - "9002:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  celery-worker:
    build: .
    depends_on:
      - redis
      - minio
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_EXTERNAL_ENDPOINT=http://localhost:9001
      - MINIO_MEDIA_BUCKET_NAME=media
    volumes:
      - ./data:/app/data

    command: >
      sh -c "celery -A future_school.celery.celery_app worker -l info"

  celery-beat:
    build: .
    depends_on:
      - redis
      - minio
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_EXTERNAL_ENDPOINT=http://localhost:9001
      - MINIO_MEDIA_BUCKET_NAME=media
    volumes:
      - ./data:/app/data

    command: >
      sh -c "celery -A future_school.celery.celery_app beat -l info"

volumes:
  redis-data:
  minio-data:
